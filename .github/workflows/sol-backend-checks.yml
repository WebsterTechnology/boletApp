name: Sòl backend checks

on:
  pull_request:
    paths:
      - 'backend-ts/**'
      - '.github/workflows/sol-backend-checks.yml'
  push:
    branches:
      - migration/backend-typescript
    paths:
      - 'backend-ts/**'
      - '.github/workflows/sol-backend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sol_ci
          POSTGRES_PASSWORD: sol_ci_password
          POSTGRES_DB: sol_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sol_ci -d sol_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SOL_PG_TEST_URL: postgres://sol_ci:sol_ci_password@localhost:5432/sol_ci
      DATABASE_URL: postgres://sol_ci:sol_ci_password@localhost:5432/sol_ci
      JWT_SECRET: ci-test-only-secret
      DB_SSL: "false"
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run backend tests
        run: npm test -- --reporter=default
      - name: Compile backend
        run: npm run build
